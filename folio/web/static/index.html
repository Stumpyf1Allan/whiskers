<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiskers</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0b6e6e">
</head>
<body>
<div class="boot" id="boot"><div><div class="spinner"></div><div class="muted small">Opening Whiskers</div></div></div>

<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">
      <!-- A sprite sheet rather than an animated image, as in Mittens & Pence: CSS can start
           and stop it exactly, so the cat plays its ten seconds and then rests, instead of
           looping for ever in the corner of the eye. -->
      <button id="logo" class="mark" type="button" aria-label="Whiskers" title="Click to watch again"></button>
      <div class="brand-name">Whiskers</div>
      <div class="brand-sub" id="brand-sub">Investments, mortgage and retirement</div>
    </div>
    <div class="rail-title" id="rail-title"></div>
    <nav id="nav" aria-label="Screens in this section"></nav>
    <div class="rail-foot">
      <button id="help" type="button" title="Something wrong, or an idea? Email Allan.">
        <img src="help.webp" alt="" width="40" height="40"><span class="help-label">Help</span>
      </button>
      <button class="btn wide" id="refresh-btn" type="button" title="Sync your platforms, read the statements folder and fetch the latest prices">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span class="lbl">Refresh</span>
      </button>
      <button class="btn ghost wide" id="tour-btn" type="button" title="A one-minute tour of Whiskers">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><path d="M12 17h.01"/></svg>
        <span class="lbl">Tour</span>
      </button>
      <div class="status" id="refresh-status"></div>
      <div class="credit">&copy; Allan Clark</div>
    </div>
  </aside>

  <main class="main">
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="banner fake" id="fake-banner" hidden>Test mode: every price on this screen is invented. Restart without WHISKERS_FAKE_MARKET to see real ones.</div>
    <div class="banner update" id="update-banner" hidden></div>
    <div class="banner reminder" id="reminder-banner" hidden></div>
    <header class="topbar">
      <div>
        <h1 id="title">Overall</h1>
        <p id="subtitle"></p>
      </div>
      <div class="topbar-actions">
        <button class="btn ghost" id="hide-btn" type="button" aria-pressed="false" title="Hide amounts (for screen sharing)"></button>
        <button class="btn ghost" id="theme-btn" type="button" title="Light or dark"></button>
        <button class="btn ghost" id="settings-btn" type="button" title="Settings" aria-label="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span class="lbl">Settings</span>
        </button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header><h2 id="modal-title"></h2><button class="btn ghost" id="modal-x" type="button" aria-label="Close">Close</button></header>
    <div id="modal-body"></div>
    <div id="modal-foot"></div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="drop-veil" id="drop-veil" hidden><div>Drop the file to import it</div></div>

<script src="charts.js"></script>
<script src="app.js"></script>
<script src="overall.js"></script>
<script src="mortgage.js"></script>
<script src="retirement.js"></script>
<script src="planreview.js"></script>
<script src="importer.js"></script>
<script src="budget.js"></script>
</body>
</html>
