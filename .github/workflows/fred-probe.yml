# Temporary: find out which requests FRED answers from GitHub's machines. Removed before the PR.
name: FRED probe
on:
  push:
    branches: [fred-fix]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask FRED in different ways
        shell: python3 {0}
        run: |
          import urllib.request, time, ssl
          U = "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SAHMREALTIME"
          A = "application/json,text/csv,*/*;q=0.8"
          tries = {
            "whiskers-now": {"User-Agent": "Whiskers (personal portfolio app)", "Accept": A, "Accept-Language": "en-GB,en;q=0.9"},
            "whiskers-ua-only": {"User-Agent": "Whiskers (personal portfolio app)"},
            "python-default": {},
            "curl-ua": {"User-Agent": "curl/8.5.0", "Accept": "*/*"},
            "chrome-ua": {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36", "Accept": A},
            "whiskers-ua-with-url": {"User-Agent": "Whiskers/1.4 (+https://github.com/Stumpyf1Allan/whiskers)", "Accept": A},
          }
          for name, h in tries.items():
              t = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(U, headers=h), timeout=20) as r:
                      b = r.read()
                  print(f"{name}: {r.status} in {time.time()-t:.1f}s, {len(b)} bytes, {b[:30]!r}", flush=True)
              except Exception as e:
                  print(f"{name}: FAILED after {time.time()-t:.1f}s: {type(e).__name__}: {e}", flush=True)
      - name: Same with curl
        run: |
          for ua in "Whiskers (personal portfolio app)" "curl/8.5.0"; do
            curl -s -o /dev/null --max-time 20 -A "$ua" -w "curl as '$ua': %{http_code} in %{time_total}s, %{size_download} bytes\n" "https://fred.stlouisfed.org/graph/fredgraph.csv?id=SAHMREALTIME" || echo "curl as '$ua': no answer"
          done
